<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d16;
    --bg-glow-1: rgba(236,72,153,0.10);
    --bg-glow-2: rgba(59,130,246,0.10);
    --card: #12151f;
    --card-border: rgba(255,255,255,0.08);
    --ink: #f5f6fb;
    --muted: #8b90a3;
    --pink: #ec4899;
    --pink-deep: #db2777;
    --purple: #7c3aed;
    --blue: #3b82f6;
    --orange: #f59e0b;
    --green: #10b981;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, var(--bg-glow-1), transparent 40%),
      radial-gradient(circle at 90% 15%, var(--bg-glow-2), transparent 45%),
      var(--bg);
    padding: 36px 14px 70px;
  }

  .wrap { max-width: 620px; margin: 0 auto; position: relative; }

  .menu-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
  }
  .menu-btn span, .menu-btn::before, .menu-btn::after {
    content: '';
    display: block;
    width: 18px;
    height: 2.5px;
    background: var(--ink);
    border-radius: 2px;
    position: absolute;
  }
  .menu-btn::before { transform: translateY(-6px); }
  .menu-btn::after { transform: translateY(6px); }

  .menu-dropdown {
    position: absolute;
    top: 46px;
    right: 0;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    overflow: hidden;
    min-width: 170px;
    z-index: 30;
    display: none;
  }
  .menu-dropdown.open { display: block; }
  .menu-item {
    padding: 13px 16px;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease;
  }
  .menu-item:hover { background: rgba(255,255,255,0.05); }
  .menu-item.active { color: var(--pink); background: rgba(236,72,153,0.08); }
  .menu-item + .menu-item { border-top: 1px solid var(--card-border); }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 26px;
  }

  .title-block { text-align: center; flex: 1; }

  .badge-ball {
    font-size: 30px;
    display: block;
    margin: 0 auto 6px;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 900;
    font-size: clamp(26px, 7.5vw, 38px);
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  h1 .dot { color: var(--pink); }

  .gw-pill {
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    padding: 8px 16px;
    text-align: center;
    min-width: 76px;
  }
  .gw-pill .num {
    display: block;
    font-weight: 900;
    font-size: 18px;
    color: var(--pink);
  }
  .gw-pill .lbl {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-line {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    margin: -14px 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .dot-pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 0 0 rgba(236,72,153,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(236,72,153,0.55); }
    70% { box-shadow: 0 0 0 7px rgba(236,72,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(236,72,153,0); }
  }

  .col-header {
    display: grid;
    grid-template-columns: 56px 1fr 78px 78px;
    align-items: center;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .col-header span {
    color: var(--muted);
    font-weight: 800;
    font-size: 11px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .row {
    display: grid;
    grid-template-columns: 56px 1fr 78px 78px;
    align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 9px 10px;
    margin-bottom: 9px;
    border: 1.5px solid var(--card-border);
    transition: border-color 0.12s ease;
  }
  .row:hover { border-color: rgba(236,72,153,0.35); }

  .rank-badge {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px;
    color: #fff;
    margin: 0 auto;
  }
  .rank-badge.top { background: linear-gradient(135deg, var(--pink), var(--purple)); }
  .rank-badge.rest { background: rgba(255,255,255,0.06); color: var(--ink); border: 1.5px solid var(--card-border); }

  .team-cell { text-align: center; padding: 0 6px; overflow: hidden; }
  .team-link {
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.12s ease;
  }
  .team-link:hover { background: rgba(255,255,255,0.04); }
  .team-link:hover .team-name { color: var(--pink); }
  .team-name {
    font-weight: 800; font-size: 14px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .manager-name {
    font-size: 10.5px; color: var(--muted); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .stat { text-align: center; font-weight: 800; font-size: 14px; color: var(--ink); }
  .stat.gw { color: var(--muted); font-weight: 700; font-size: 13px; }

  .highlight-box {
    margin-top: 22px;
    background: linear-gradient(135deg, rgba(236,72,153,0.15), rgba(124,58,237,0.15));
    border: 1.5px solid rgba(236,72,153,0.3);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: center;
  }
  .highlight-box .lbl {
    color: var(--pink);
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .highlight-box .val {
    color: var(--ink);
    font-size: 20px;
    font-weight: 900;
  }
  .highlight-box .sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
    font-weight: 600;
  }

  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
  }

  .msg {
    text-align: center;
    padding: 44px 16px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .recap-hero {
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 18px;
    margin-bottom: 14px;
    text-align: center;
  }
  .recap-hero .rlbl {
    color: var(--pink);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .recap-hero .rtitle {
    color: var(--ink);
    font-size: 22px;
    font-weight: 900;
    margin: 4px 0 10px;
  }
  .recap-hero .rtag {
    display: inline-block;
    background: rgba(236,72,153,0.14);
    border: 1px solid rgba(236,72,153,0.4);
    color: var(--pink);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .recap-top3 { margin-bottom: 14px; }
  .recap-row {
    display: grid;
    grid-template-columns: 34px 1fr 60px;
    align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1.5px solid var(--card-border);
  }
  .recap-row .rn {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    margin: 0 auto;
  }
  .recap-row .rteam { text-align: center; font-weight: 800; font-size: 14px; }
  .recap-row .rpts { text-align: center; font-weight: 900; font-size: 15px; color: var(--ink); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 6px 12px;
    text-align: center;
    border: 1.5px solid var(--card-border);
  }
  .stat-card .sicon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 8px;
    font-size: 15px;
  }
  .stat-card.avg .sicon { background: rgba(59,130,246,0.16); }
  .stat-card.high .sicon { background: rgba(16,185,129,0.16); }
  .stat-card.low .sicon { background: rgba(245,158,11,0.16); }
  .stat-card .sval { font-size: 18px; font-weight: 900; color: var(--ink); }
  .stat-card .slbl { font-size: 10px; color: var(--muted); font-weight: 700; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.03em; }

  .section-title {
    font-weight: 800;
    font-size: 11px;
    color: var(--purple);
    margin: 18px 0 8px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cap-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .cap-card .cinfo { text-align: left; }
  .cap-card .cwho { font-weight: 800; font-size: 13.5px; }
  .cap-card .cwhat { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .cap-card .cval {
    font-weight: 900; font-size: 17px; color: var(--pink);
    white-space: nowrap;
  }

  .derby-box {
    background: linear-gradient(135deg, rgba(245,158,11,0.14), rgba(236,72,153,0.14));
    border: 1.5px solid rgba(245,158,11,0.3);
    border-radius: 14px;
    padding: 16px 14px;
    margin-top: 16px;
    text-align: center;
  }
  .derby-box .dlbl { color: var(--orange); font-size: 11px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .derby-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .derby-team { color: var(--ink); font-weight: 800; font-size: 13px; flex: 1; text-align: center; }
  .derby-score { color: var(--ink); font-weight: 900; font-size: 18px; }
  .derby-vs {
    background: var(--orange);
    color: #1a1206;
    font-weight: 900;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
  }
  .derby-diff { color: var(--muted); font-size: 11px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="menu-btn" id="menu-btn"></div>
    <div class="menu-dropdown" id="menu-dropdown">
      <div class="menu-item active" data-view="table">Table</div>
      <div class="menu-item" data-view="recap">Gameweek Recap</div>
    </div>

    <header>
      <div class="gw-pill">
        <span class="num" id="gw-num">–</span>
        <span class="lbl">GW</span>
      </div>
      <div class="title-block">
        <span class="badge-ball">⚽</span>
        <h1><span id="league-name">Loading…</span><span class="dot">.</span></h1>
      </div>
      <div style="width:76px"></div>
    </header>

    <div class="status-line"><span class="dot-pulse"></span><span id="updated-text">Checking…</span></div>

    <div id="view-table">
      <div id="board-wrap" style="display:none">
        <div class="col-header">
          <span>Rank</span>
          <span>Team</span>
          <span>GW</span>
          <span>Total</span>
        </div>
        <div id="rows"></div>

        <div class="highlight-box">
          <div class="lbl">Top Score This Gameweek</div>
          <div class="val" id="top-gw-name">–</div>
          <div class="sub" id="top-gw-points">–</div>
        </div>
      </div>
      <div class="msg" id="loading-msg">Loading standings…</div>
    </div>

    <div id="view-recap" style="display:none">
      <div id="recap-content"></div>
      <div class="msg" id="recap-msg" style="display:none">No recap available for this gameweek yet.</div>
    </div>

    <footer>Auto-refreshing · Source: fantasy.premierleague.com</footer>
  </div>

<script>
  const REFRESH_MS = 60 * 1000;
  let latestData = null;

  function timeAgo(iso) {
    const then = new Date(iso).getTime();
    const diffMin = Math.floor((Date.now() - then) / 60000);
    if (diffMin < 1) return 'Updated: just now';
    if (diffMin === 1) return 'Updated: 1 minute ago';
    if (diffMin < 60) return `Updated: ${diffMin} minutes ago`;
    const hrs = Math.floor(diffMin / 60);
    return `Updated: ${hrs}h ${diffMin % 60}m ago`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  const menuBtn = document.getElementById('menu-btn');
  const menuDropdown = document.getElementById('menu-dropdown');
  const viewTable = document.getElementById('view-table');
  const viewRecap = document.getElementById('view-recap');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });
  document.addEventListener('click', () => menuDropdown.classList.remove('open'));

  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      const view = item.dataset.view;
      viewTable.style.display = view === 'table' ? 'block' : 'none';
      viewRecap.style.display = view === 'recap' ? 'block' : 'none';
      menuDropdown.classList.remove('open');
      if (view === 'recap' && latestData) renderRecap(latestData);
    });
  });

  function renderTable(data) {
    if (!data.players || data.players.length === 0) {
      document.getElementById('loading-msg').textContent =
        'No data yet — try refreshing in a moment.';
      return;
    }

    const rows = data.players.map(p => {
      const gw = data.current_gw || 1;
      const fplUrl = p.team_id
        ? `goto.html?u=${encodeURIComponent(`https://fantasy.premierleague.com/entry/${p.team_id}/event/${gw}`)}`
        : null;
      const teamBlock = `
          <div class="team-name">${escapeHtml(p.team_name)}</div>
          <div class="manager-name">${escapeHtml(p.manager_name)}</div>
      `;
      return `
      <div class="row">
        <div><span class="rank-badge ${p.rank <= 3 ? 'top' : 'rest'}">${p.rank}</span></div>
        <div class="team-cell">
          ${fplUrl
            ? `<a class="team-link" href="${fplUrl}" target="_blank" rel="noopener noreferrer">${teamBlock}</a>`
            : teamBlock}
        </div>
        <div class="stat gw">${p.gw_points ?? '–'}</div>
        <div class="stat">${p.total_points ?? '–'}</div>
      </div>
    `;
    }).join('');

    document.getElementById('rows').innerHTML = rows;
    document.getElementById('board-wrap').style.display = 'block';
    document.getElementById('loading-msg').style.display = 'none';

    const topGw = [...data.players].sort((a, b) => (b.gw_points ?? -1) - (a.gw_points ?? -1))[0];
    if (topGw) {
      document.getElementById('top-gw-name').textContent = topGw.team_name;
      document.getElementById('top-gw-points').textContent = `${topGw.gw_points} points this gameweek`;
    }
  }

  function renderRecap(data) {
    const s = data.gw_summary;
    const container = document.getElementById('recap-content');
    const msg = document.getElementById('recap-msg');

    if (!s) {
      container.innerHTML = '';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';

    const medalNames = ['🥇', '🥈', '🥉'];
    const top3Html = (s.top_scorers || []).map((p, i) => `
      <div class="recap-row">
        <div class="rn">${medalNames[i] || (i + 1)}</div>
        <div class="rteam">${escapeHtml(p.team_name)}</div>
        <div class="rpts">${p.points}</div>
      </div>
    `).join('');

    const statGridHtml = `
      <div class="stat-grid">
        <div class="stat-card avg"><div class="sicon">📊</div><div class="sval">${s.average_score ?? '–'}</div><div class="slbl">Average</div></div>
        <div class="stat-card high"><div class="sicon">🔥</div><div class="sval">${s.highest_score ?? '–'}</div><div class="slbl">Highest</div></div>
        <div class="stat-card low"><div class="sicon">🥶</div><div class="sval">${s.lowest_score ?? '–'}</div><div class="slbl">Lowest</div></div>
      </div>
    `;

    let captainsHtml = '';
    if (s.bench_king || s.worst_captain || s.best_differential_captain) {
      captainsHtml += `<div class="section-title">🎖️ Captaincy Watch</div>`;
      if (s.bench_king) {
        captainsHtml += `
          <div class="cap-card">
            <div class="cval">${s.bench_king.bench_points}</div>
            <div class="cinfo">
              <div class="cwho">${escapeHtml(s.bench_king.team_name)}</div>
              <div class="cwhat">👑 Bench King — most points left on the bench</div>
            </div>
          </div>
        `;
      }
      if (s.worst_captain) {
        captainsHtml += `
          <div class="cap-card">
            <div class="cval">${s.worst_captain.captain_points}</div>
            <div class="cinfo">
              <div class="cwho">${escapeHtml(s.worst_captain.team_name)}</div>
              <div class="cwhat">📉 Captaincy Blunder — captained ${escapeHtml(s.worst_captain.captain_name)}</div>
            </div>
          </div>
        `;
      }
      if (s.best_differential_captain) {
        captainsHtml += `
          <div class="cap-card">
            <div class="cval">${s.best_differential_captain.captain_points}</div>
            <div class="cinfo">
              <div class="cwho">${escapeHtml(s.best_differential_captain.team_name)}</div>
              <div class="cwhat">🐺 Lone Wolf — sole captain of ${escapeHtml(s.best_differential_captain.captain_name)}</div>
            </div>
          </div>
        `;
      }
    }

    let derbyHtml = '';
    if (s.derby) {
      derbyHtml = `
        <div class="derby-box">
          <div class="dlbl">⚔️ Derby of the Week — closest pair in the table</div>
          <div class="derby-row">
            <div class="derby-team">${escapeHtml(s.derby.team_a)}<br><span class="derby-score">${s.derby.score_a}</span></div>
            <div class="derby-vs">VS</div>
            <div class="derby-team">${escapeHtml(s.derby.team_b)}<br><span class="derby-score">${s.derby.score_b}</span></div>
          </div>
          <div class="derby-diff">Only ${s.derby.diff} points between them</div>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="recap-hero">
        <div class="rlbl">Gameweek Recap</div>
        <div class="rtitle">Gameweek ${s.gw}</div>
        <div class="rtag">🔥 ${escapeHtml(s.top_scorers?.[0]?.team_name || '')} — ${s.highest_score} pts</div>
      </div>
      <div class="recap-top3">${top3Html}</div>
      ${statGridHtml}
      ${captainsHtml}
      ${derbyHtml}
    `;
  }

  async function loadData() {
    try {
      const res = await fetch('/api/data?_=' + Date.now());
      if (!res.ok) throw new Error('no data yet');
      const data = await res.json();
      latestData = data;

      document.getElementById('league-name').textContent = data.league_name || 'Fantasy League';
      document.getElementById('updated-text').textContent = timeAgo(data.last_updated);
      document.getElementById('gw-num').textContent = data.current_gw ?? '—';

      renderTable(data);

      if (viewRecap.style.display !== 'none') {
        renderRecap(data);
      }
    } catch (e) {
      document.getElementById('loading-msg').textContent =
        'Could not load data — try refreshing in a moment.';
    }
  }

  loadData();
  setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
